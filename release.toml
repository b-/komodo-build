[[repo]]
name = "periphery-bin-aarch64"
tags = ["release", "periphery", "aarch64"]
[repo.config]
builder = "aarch64-builder"
repo = "mbecker20/komodo"
on_pull.path = "."
on_pull.command = """
/root/.cargo/bin/cargo clean

/root/.cargo/bin/cargo build -p komodo_periphery --release

curl --user mbecker20:[[KOMODO_GIT_TOKEN]] --upload-file ./target/release/periphery https://git.komo.do/api/packages/mbecker20/generic/periphery/[[KOMODO_VERSION]]-release/periphery-aarch64
"""

