##

[[repo]]
name = "upload-binaries-dev"
tags = ["dev", "binaries"]
[repo.config]
builder = "local"
git_provider = "git.komo.do"
repo = "komodo/build"
on_clone.command = """
bash ./upload-binaries.sh dev git.komo.do/moghtech/binaries:latest-dev [[KOMODO_DEV_VERSION]] [[KOMODO_GIT_TOKEN]]
"""

##

[[procedure]]
name = "build-dev"
tags = ["dev"]

[[procedure.config.stage]]
name = "Build Binaries + Frontend"
enabled = true
executions = [
  { execution.type = "RunBuild", execution.params.build = "binaries-dev-x86_64", enabled = true },
  { execution.type = "RunBuild", execution.params.build = "binaries-dev-aarch64", enabled = true },
  { execution.type = "RunBuild", execution.params.build = "komodo-frontend-dev", enabled = true }
]

[[procedure.config.stage]]
name = "Build Multi Arch + Upload Binaries"
enabled = true
executions = [
  { execution.type = "RunBuild", execution.params.build = "komodo-core-dev", enabled = true },
  { execution.type = "RunBuild", execution.params.build = "komodo-periphery-dev", enabled = true },
  { execution.type = "BuildRepo", execution.params.repo = "upload-binaries-dev", enabled = true }
]

##

[[action]]
name = "publish-dev"
tags = ["dev"]
[action.config]
file_contents = """
const VERSION = "1.17.0";

const builds = await komodo.read("ListBuilds", { query: { tags: ["dev"] } });

for (const build of builds) {
  console.log(build.name);
}

// await komodo.write("UpdateVariableValue", {
//   name: "KOMODO_DEV_VERSION",
//   value: VERSION,
// });
"""

##

[[resource_sync]]
name = "dev"
tags = ["dev"]
[resource_sync.config]
git_provider = "git.komo.do"
repo = "moghtech/build"
git_account = "mbecker20"
resource_path = ["dev.toml"]
managed = true
match_tags = ["dev"]